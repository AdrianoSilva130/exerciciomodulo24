name: CI - API Tests

on:
  push:
    branches: [ "ci" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Start API
        run: npx serverest &

      - name: Start Pactum Flow Server
        run: npx pactum-flow-server &

      - name: Wait for servers
        run: sleep 5

      - name: Run tests
        run: npm test

      - name: Gerar relatório HTML (Mochawesome)
        run: npm run cy:report

      - name: Publicar relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mochawesome-report
